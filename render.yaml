services:
  - type: web
    name: outsidefix-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_ORIGIN
        sync: false
      - key: CLIENT_APP_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GEMMA_API_URL
        sync: false
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA_MODEL
        sync: false
  - type: web
    name: outsidefix-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
